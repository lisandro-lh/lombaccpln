<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Cerdas Cermat - PLN Tobelo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .btn-answer { transition: transform 0.1s; }
        .btn-answer:active { transform: scale(0.95); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <!-- Container Utama -->
    <div id="app" class="max-w-3xl mx-auto p-4 pt-10">
        
        <!-- LAYAR 1: MENU UTAMA -->
        <div id="screen-home" class="text-center space-y-6 bg-white p-8 rounded-xl shadow-lg mt-10">
            <h1 class="text-3xl font-bold text-blue-600">⚡ Kuis Cerdas Cermat PLN</h1>
            <p class="text-gray-500">Pilih mode masuk:</p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <button onclick="showScreen('screen-host')" class="px-6 py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700">👨‍🏫 Masuk sebagai Host</button>
                <button onclick="showScreen('screen-player-login')" class="px-6 py-3 bg-green-500 text-white rounded-lg font-bold hover:bg-green-600">📱 Masuk sebagai Peserta</button>
            </div>
        </div>

        <!-- LAYAR 2: LOGIN PESERTA -->
        <div id="screen-player-login" class="hidden text-center space-y-4 bg-white p-8 rounded-xl shadow-lg mt-10">
            <h2 class="text-2xl font-bold">Gabung Kuis</h2>
            <input type="text" id="input-pin" placeholder="PIN Kuis (4 Digit)" class="w-full text-center p-3 border-2 border-gray-300 rounded text-2xl font-bold uppercase" maxlength="4">
            <input type="text" id="input-nama" placeholder="Nama Anda" class="w-full text-center p-3 border-2 border-gray-300 rounded text-xl">
            <button id="btn-join" class="w-full py-3 bg-green-500 text-white rounded-lg font-bold text-xl hover:bg-green-600">GABUNG SEKARANG</button>
            <button onclick="showScreen('screen-home')" class="text-sm text-gray-400 mt-4 block mx-auto">Kembali</button>
        </div>

        <!-- LAYAR 3: HOST DASHBOARD -->
        <div id="screen-host" class="hidden space-y-6 bg-white p-8 rounded-xl shadow-lg">
            <h2 class="text-2xl font-bold text-blue-600">Dashboard Host</h2>
            
            <!-- Simulasi Upload Soal / Generate -->
            <div class="bg-blue-50 p-4 rounded border border-blue-200">
                <h3 class="font-bold mb-2">1. Siapkan Soal</h3>
                <textarea id="host-soal" rows="4" class="w-full p-2 border rounded text-sm mb-2" placeholder="Ketik soal atau paste teks materi di sini (Nantinya bisa dikembangkan untuk otomatis generate soal pakai AI)"></textarea>
                <button id="btn-create-room" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 w-full font-bold">Buat Ruang Kuis (Generate PIN)</button>
            </div>

            <!-- PIN & Pemain -->
            <div id="host-lobby-info" class="hidden text-center">
                <p class="text-lg">PIN RUANGAN ANDA:</p>
                <h1 id="display-pin" class="text-6xl font-black text-gray-800 tracking-widest my-4">----</h1>
                <p>Menunggu peserta bergabung... (<span id="player-count">0</span> Orang)</p>
                <ul id="list-players" class="flex flex-wrap justify-center gap-2 mt-4 text-sm font-bold text-blue-800"></ul>
                <button id="btn-start-game" class="mt-6 w-full py-3 bg-red-500 text-white rounded-lg font-bold hover:bg-red-600">MULAI KUIS</button>
            </div>
        </div>

        <!-- LAYAR 4: GAME AREA (PLAYER) -->
        <div id="screen-game-player" class="hidden text-center flex-col h-[80vh] justify-center space-y-4">
            <h2 class="text-xl font-bold mb-4">Lihat Layar Host! Pilih Jawabanmu:</h2>
            <div class="grid grid-cols-2 gap-4 h-full">
                <button onclick="submitAnswer('A')" class="btn-answer bg-red-500 text-white text-3xl rounded-xl shadow-[0_8px_0_#991b1b]"></button>
                <button onclick="submitAnswer('B')" class="btn-answer bg-blue-500 text-white text-3xl rounded-xl shadow-[0_8px_0_#1e40af]"></button>
                <button onclick="submitAnswer('C')" class="btn-answer bg-yellow-400 text-white text-3xl rounded-xl shadow-[0_8px_0_#a16207]"></button>
                <button onclick="submitAnswer('D')" class="btn-answer bg-green-500 text-white text-3xl rounded-xl shadow-[0_8px_0_#166534]"></button>
            </div>
        </div>

        <!-- LAYAR 5: SELESAI / EKSPOR -->
        <div id="screen-result" class="hidden text-center bg-white p-8 rounded-xl shadow-lg mt-10 space-y-4">
            <h2 class="text-3xl font-bold text-green-600">Kuis Selesai! 🎉</h2>
            <p id="final-score" class="text-xl font-bold text-gray-700"></p>
            
            <!-- Tombol Kirim ke Spreadsheet -->
            <button id="btn-export-sheet" class="mt-4 px-6 py-3 bg-green-600 text-white rounded font-bold hover:bg-green-700 shadow flex items-center justify-center mx-auto gap-2">
                📊 Sinkronisasi Nilai ke Spreadsheet
            </button>
            <p id="export-status" class="text-sm text-gray-500 hidden mt-2">Data berhasil dikirim!</p>
        </div>

    </div>

    <!-- FIREBASE & LOGIC SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        // Konfigurasi dari Anda
        const firebaseConfig = {
            apiKey: "AIzaSyAXbg44BtfEc6tPU3X3mzUU4xnfm-Z52xk",
            authDomain: "lombacerdsa-cermat-pln.firebaseapp.com",
            projectId: "lombacerdsa-cermat-pln",
            storageBucket: "lombacerdsa-cermat-pln.firebasestorage.app",
            messagingSenderId: "925030222685",
            appId: "1:925030222685:web:ba49e175056505881d36b4",
            measurementId: "G-CLEP11LDMQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- GANTI URL INI DENGAN WEB APP URL GOOGLE SCRIPT ANDA ---
        const GOOGLE_SHEETS_URL = "URL_WEB_APP_GOOGLE_APPS_SCRIPT_ANDA_DISINI";

        // State Global
        let currentPin = "";
        let playerName = "";
        let playerScore = 0;

        // Fungsi Pindah Layar
        window.showScreen = function(screenId) {
            document.querySelectorAll('#app > div').forEach(el => el.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
            if(screenId === 'screen-game-player') {
                document.getElementById('screen-game-player').classList.add('flex');
            } else {
                document.getElementById('screen-game-player').classList.remove('flex');
            }
        }

        // --- LOGIC HOST ---
        document.getElementById('btn-create-room').addEventListener('click', async () => {
            currentPin = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('display-pin').innerText = currentPin;
            document.getElementById('host-lobby-info').classList.remove('hidden');
            
            // Buat ruangan di Firestore
            await setDoc(doc(db, "rooms", currentPin), {
                status: "waiting",
                createdAt: new Date()
            });

            // Dengarkan peserta yang masuk
            onSnapshot(collection(db, "rooms", currentPin, "players"), (snapshot) => {
                const list = document.getElementById('list-players');
                list.innerHTML = "";
                document.getElementById('player-count').innerText = snapshot.size;
                snapshot.forEach((doc) => {
                    const li = document.createElement('li');
                    li.className = "bg-blue-100 px-3 py-1 rounded-full";
                    li.innerText = doc.data().nama;
                    list.appendChild(li);
                });
            });
        });

        document.getElementById('btn-start-game').addEventListener('click', async () => {
            await setDoc(doc(db, "rooms", currentPin), { status: "playing" }, { merge: true });
            alert("Kuis dimulai! Peserta sekarang bisa menekan tombol.");
        });

        // --- LOGIC PESERTA ---
        document.getElementById('btn-join').addEventListener('click', async () => {
            const pin = document.getElementById('input-pin').value.trim();
            const nama = document.getElementById('input-nama').value.trim();
            
            if(pin.length === 4 && nama !== "") {
                currentPin = pin;
                playerName = nama;
                
                // Daftarkan ke Firestore
                await setDoc(doc(db, "rooms", currentPin, "players", playerName), {
                    nama: playerName,
                    score: 0
                });

                showScreen('screen-game-player');

                // Dengarkan status game (jika host menghentikan kuis)
                onSnapshot(doc(db, "rooms", currentPin), (doc) => {
                    if (doc.data()?.status === "finished") {
                        showScreen('screen-result');
                        document.getElementById('final-score').innerText = `Skor Akhir Anda: ${playerScore}`;
                    }
                });
            } else {
                alert("Masukkan PIN 4 digit dan Nama Anda!");
            }
        });

        window.submitAnswer = function(pilihan) {
            // Simulasi skoring (karena AI/soal kompleks diringkas)
            playerScore += 100; 
            
            // Update skor ke Firestore
            setDoc(doc(db, "rooms", currentPin, "players", playerName), {
                score: playerScore
            }, { merge: true });
            
            alert("Jawaban terekam!");
        }

        // --- EKSPOR SPREADSHEET ---
        document.getElementById('btn-export-sheet').addEventListener('click', () => {
            const statusText = document.getElementById('export-status');
            
            if (GOOGLE_SHEETS_URL === "URL_WEB_APP_GOOGLE_APPS_SCRIPT_ANDA_DISINI") {
                alert("Harap masukkan URL Google Apps Script Anda di dalam kode terlebih dahulu.");
                return;
            }

            // Data yang dikirim
            const payload = {
                nama: playerName || "Host/Uji Coba",
                nilai: playerScore,
                peringkat: "-"
            };

            fetch(GOOGLE_SHEETS_URL, {
                method: "POST",
                mode: 'no-cors',
                headers: {
                    "Content-Type": "text/plain",
                },
                body: JSON.stringify(payload)
            }).then(() => {
                statusText.classList.remove('hidden');
                document.getElementById('btn-export-sheet').disabled = true;
                document.getElementById('btn-export-sheet').classList.add('opacity-50');
            }).catch((error) => {
                console.error("Error:", error);
                alert("Gagal mengirim data.");
            });
        });

    </script>
</body>
</html>
